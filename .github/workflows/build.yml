# Stylus is a macOS app (AppKit, CoreAudio): it builds on a macOS runner, never on the dev Mac
# (small disk) or Linux. Every push tests and builds; a v* tag also publishes the DMG as a release.
name: build

# day-to-day builds run on the MacBook Air via `make` (see Makefile); CI is for release tags and manual runs
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: npm ci

      - name: Frontend tests
        run: npx vitest run

      - name: Release script tests
        run: python3 -m unittest discover -s scripts

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # createUpdaterArtifacts: the signed Stylus.app.tar.gz + .sig for the auto-updater (updater.rs).
      # Only release builds turn it on; the key's password is empty
      - name: Build Stylus.app, DMG and update archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Collect artifacts
        run: |
          mkdir -p out
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Stylus.app out/Stylus.app.zip
          cp src-tauri/target/release/bundle/dmg/*.dmg out/Stylus.dmg
          shasum -a 256 out/Stylus.dmg | tee out/Stylus.dmg.sha256
          cp src-tauri/target/release/bundle/macos/Stylus.app.tar.gz src-tauri/target/release/bundle/macos/Stylus.app.tar.gz.sig out/
          # the feed installed copies read (releases/latest/download/latest.json); the app shows no notes
          v=$(node -p 'require("./package.json").version')
          python3 scripts/update_feed.py "$v" --notes "Stylus $v" --sig out/Stylus.app.tar.gz.sig \
            --url "https://github.com/1905/stylus-spotify-mini-player/releases/download/v$v/Stylus.app.tar.gz" --out out/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: stylus-macos
          path: out/
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Stylus.dmg
            out/Stylus.dmg.sha256
            out/Stylus.app.tar.gz
            out/Stylus.app.tar.gz.sig
            out/latest.json
          generate_release_notes: true
