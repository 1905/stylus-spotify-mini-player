[package]
name = "rust-spotify"
version = "0.1.0"
description = "Spotify profile and playlists"
edition = "2021"

[lib]
name = "rust_spotify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
dirs = "5"
# The in-app Connect speaker "The Run" (plans/2026-10-02-standalone). Not librespot-oauth:
# its listener blocks with no deadline, so the player login reuses auth.rs (oauth_login).
librespot-core = "0.8.0"
librespot-playback = { version = "0.8.0", features = ["rodio-backend"] }
librespot-connect = "0.8.0"
# only for AuthenticationType: the session hands back its reusable login as raw fields
librespot-protocol = "0.8.0"
# default `v1` feature = the macOS Keychain store
keyring = "4"
# OS media keys + Now Playing (MPRemoteCommandCenter / MPNowPlayingInfoCenter on macOS)
souvlaki = "0.8.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Size over speed: the app is a thin remote, its hot path is waiting on HTTP.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# panic = "unwind" (default): librespot's audio output panics when no output device exists; abort would take the whole app down
strip = true

# librespot-core 0.8.0 exits the process on a non-Premium account (session.rs check_catalogue);
# vendored with that exit removed. Re-apply when upgrading librespot.
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
