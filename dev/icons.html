<!doctype html>
<!-- Contact sheet: every icon from src/lib/icons.js at 16/20/24/32/48 px on three stage tints. -->
<!-- Serve the project root and open /dev/icons.html (add ?grid to see the 24×24 grid and the 2 px margin). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Needle icons</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #0e0d12;
        color: #f6f4f8;
        font: 12px/1.3 -apple-system, system-ui, sans-serif;
      }
      .sheets {
        display: flex;
        gap: 16px;
      }
      .sheet {
        padding: 16px 20px;
        border-radius: 14px;
      }
      .sheet h2 {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 600;
        opacity: 0.6;
      }
      .row {
        display: grid;
        grid-template-columns: 92px repeat(5, 56px);
        align-items: center;
        height: 58px;
      }
      .name {
        opacity: 0.55;
      }
      .cell {
        display: grid;
        place-items: center;
        color: rgb(246 244 248 / 0.78);
      }
      .row.is-accent .cell {
        color: #1ed760;
      }
      .cell svg {
        display: block;
      }
      body.grid .cell svg {
        background:
          linear-gradient(rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.12)) content-box,
          repeating-linear-gradient(90deg, rgb(255 255 255 / 0.06) 0 1px, transparent 1px calc(100% / 24)),
          repeating-linear-gradient(0deg, rgb(255 255 255 / 0.06) 0 1px, transparent 1px calc(100% / 24));
        padding: 0;
        outline: 1px solid rgb(255 255 255 / 0.15);
      }
    </style>
  </head>
  <body>
    <div id="sheets" class="sheets"></div>
    <script type="module">
      import { ICONS } from "../src/lib/icons.js";
      if (location.search.includes("grid")) document.body.classList.add("grid");
      const SIZES = [16, 20, 24, 32, 48];
      const TINTS = [
        ["Green", "radial-gradient(64% 58% at 50% 38%, rgb(60 110 70 / .5), transparent 72%), rgb(18 34 24)"],
        ["Purple", "radial-gradient(64% 58% at 50% 38%, rgb(110 70 160 / .45), transparent 72%), rgb(30 22 44)"],
        ["Red", "radial-gradient(64% 58% at 50% 38%, rgb(170 50 50 / .45), transparent 72%), rgb(44 16 16)"],
      ];
      const sized = (s, px) => s.replace("<svg ", `<svg width="${px}" height="${px}" `);
      const rows = [...Object.entries(ICONS), ["heart (on)", ICONS.heartFilled, true], ["shuffle (on)", ICONS.shuffle, true]];
      document.getElementById("sheets").innerHTML = TINTS.map(
        ([label, bg]) =>
          `<section class="sheet" style="background:${bg}"><h2>${label}</h2>` +
          rows
            .map(([name, s, accent]) => `<div class="row${accent ? " is-accent" : ""}"><span class="name">${name}</span>${SIZES.map((px) => `<span class="cell">${sized(s, px)}</span>`).join("")}</div>`)
            .join("") +
          `</section>`,
      ).join("");
    </script>
  </body>
</html>
