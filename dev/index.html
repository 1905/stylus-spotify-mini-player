<!doctype html>
<!-- keep markup in sync with src/index.html -->
<!-- Dev harness: serve the project root (npm run dev:web) and open /dev/index.html?s=<scenario> -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Needle (dev)</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../src/styles.css" />
    <script src="mock.js"></script>
    <script type="module" src="../src/app.js"></script>
  </head>
  <body>
    <div id="bgA" class="bg is-on" aria-hidden="true"></div>
    <div id="bgB" class="bg" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <section id="login" class="login" hidden>
      <div class="login-run" aria-hidden="true">
        <div>
          <i style="--s: .232; --o: .24"></i><i style="--s: .274; --o: .34"></i><i style="--s: .326; --o: .46"></i><i style="--s: .395; --o: .62"></i>
        </div>
        <i class="is-now"></i>
        <div>
          <i style="--s: .447; --o: .9"></i><i style="--s: .447; --o: .9"></i><i style="--s: .447; --o: .9"></i><i style="--s: .447; --o: .9"></i><i style="--s: .447; --o: .9"></i>
        </div>
      </div>
      <div class="login-copy">
        <h1 id="loginTitle" class="login-title">Your music, in order</h1>
        <p id="loginSub" class="login-sub">Connect Spotify to see what played, what's playing, and what's next.</p>
        <button id="loginBtn" class="btn btn-solid" type="button">Connect Spotify</button>
        <p id="loginError" class="login-error" role="alert" hidden></p>
      </div>
    </section>

    <main id="stage" class="stage" hidden>
      <header class="topbar">
        <div class="topbar-tools">
          <button id="libraryBtn" class="btn btn-ghost nav-btn" type="button" aria-label="Library">
            <svg class="ic ic-library" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.46 15.5H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.57"/><circle cx="14" cy="13" r="7"/><circle cx="14" cy="13" r="2"/></svg>
          </button>
          <button id="searchBtn" class="btn btn-ghost nav-btn" type="button" aria-label="Search">
            <svg class="ic ic-search" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.25 15.25 4.75 4.75"/></svg>
          </button>
        </div>
        <div class="topbar-end">
          <div class="device-wrap">
            <button id="deviceBtn" class="device" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="devicePop" hidden>
              <span class="device-dot"></span><span class="device-name"></span>
              <svg class="ic ic-chevron-down" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 9.25 5.5 5.5 5.5-5.5"/></svg>
            </button>
            <div id="devicePop" class="device-pop" hidden>
              <div id="deviceList" class="device-list" role="listbox" aria-label="Spotify devices"></div>
              <p class="device-note" role="status" hidden></p>
            </div>
          </div>
          <div class="settings-wrap">
            <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPop">
              <svg class="ic ic-settings" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.33 5.3l.26-2.19h2.82l.26 2.19a6.9 6.9 0 0 1 1.88.79l1.74-1.37 1.99 1.99-1.37 1.74a6.9 6.9 0 0 1 .79 1.88l2.19.26v2.82l-2.19.26a6.9 6.9 0 0 1-.79 1.88l1.37 1.74-1.99 1.99-1.74-1.37a6.9 6.9 0 0 1-1.88.79l-.26 2.19h-2.82l-.26-2.19a6.9 6.9 0 0 1-1.88-.79l-1.74 1.37-1.99-1.99 1.37-1.74a6.9 6.9 0 0 1-.79-1.88l-2.19-.26v-2.82l2.19-.26a6.9 6.9 0 0 1 .79-1.88L4.72 6.71l1.99-1.99 1.74 1.37a6.9 6.9 0 0 1 1.88-.79z"/><circle cx="12" cy="12" r="2.75"/></svg>
            </button>
            <div id="settingsPop" class="device-pop settings-pop" role="dialog" aria-label="Settings" hidden>
              <div class="set-row">
                <span id="dockArtLabel" class="set-label">Album art as app icon</span>
                <button id="dockArtSwitch" class="switch" type="button" role="switch" aria-checked="true" aria-labelledby="dockArtLabel"></button>
              </div>
              <div class="set-row">
                <span id="coverRowLabel" class="set-label">Show cover row</span>
                <button id="coverRowSwitch" class="switch" type="button" role="switch" aria-checked="true" aria-labelledby="coverRowLabel"></button>
              </div>
              <div class="set-group">
                <span id="qualityLabel" class="set-label">Audio quality</span>
                <div id="qualityOpts" class="seg" role="radiogroup" aria-labelledby="qualityLabel">
                  <button class="seg-opt" type="button" role="radio" aria-checked="false" data-kbps="96"><span class="seg-name">Normal</span><span class="seg-sub">96 kbps</span></button>
                  <button class="seg-opt" type="button" role="radio" aria-checked="false" data-kbps="160"><span class="seg-name">High</span><span class="seg-sub">160 kbps</span></button>
                  <button class="seg-opt" type="button" role="radio" aria-checked="false" data-kbps="320"><span class="seg-name">Very high</span><span class="seg-sub">320 kbps</span></button>
                </div>
                <p id="qualityNote" class="set-note">Changing restarts the player for a moment.</p>
              </div>
              <p id="quotaStatus" class="set-note set-quota" role="status" hidden></p>
            </div>
          </div>
        </div>
      </header>

      <div id="run" class="run" aria-label="Played, now playing, and up next"><div id="runTrack" class="run-track"></div></div>

      <section class="now" aria-live="polite">
        <h1 id="nowTitle" class="now-title"></h1>
        <p id="nowArtist" class="now-artist"></p>
        <p id="nowAlbum" class="now-album"></p>
        <p id="emptyState" class="now-empty" hidden></p>
      </section>

      <footer class="transport">
        <div class="scrub-row">
          <span id="curTime" class="time">0:00</span>
          <div id="scrub" class="scrub" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="-1">
            <div id="scrubFill" class="scrub-fill"></div>
          </div>
          <span id="durTime" class="time">0:00</span>
        </div>
        <div class="controls">
          <div class="controls-lead">
            <button id="panelBtn" class="ctl" type="button" aria-label="Playlist" title="Playlist" aria-haspopup="dialog" aria-expanded="false" aria-controls="panel" disabled>
              <svg class="ic ic-playlist" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h14M4 11.5h14M4 16.5h6.5"/><path fill="currentColor" stroke="none" d="M14.5 14.1v4.8a.5.5 0 0 0 .76.43l3.9-2.4a.5.5 0 0 0 0-.86l-3.9-2.4a.5.5 0 0 0-.76.43z"/></svg>
            </button>
          </div>
          <div class="controls-main">
            <button id="shuffleBtn" class="ctl ctl-toggle" type="button" aria-label="Shuffle" title="Shuffle" aria-pressed="false">
              <svg class="ic ic-shuffle" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h2.2c2 0 3.3.9 4.4 2.5l2.8 5c1.1 1.6 2.4 2.5 4.4 2.5H20M4 17h2.2c1.3 0 2.3-.4 3.1-1.1M14.7 8.1c.8-.7 1.8-1.1 3.1-1.1H20M17 4l3 3-3 3M17 14l3 3-3 3"/></svg>
            </button>
            <button id="prevBtn" class="ctl" type="button" aria-label="Previous">
              <svg class="ic ic-previous" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M18.5 6.4v11.2a.9.9 0 0 1-1.4.75l-8.3-5.6a.9.9 0 0 1 0-1.5l8.3-5.6a.9.9 0 0 1 1.4.75z"/><rect x="5" y="5.5" width="2.25" height="13" rx="1.125"/></svg>
            </button>
            <button id="playBtn" class="ctl ctl-play" type="button" aria-label="Play">
              <svg class="ic ic-play" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M7.5 5.25v13.5a.9.9 0 0 0 1.38.76l10.6-6.75a.9.9 0 0 0 0-1.52L8.88 4.49A.9.9 0 0 0 7.5 5.25z"/></svg><svg class="ic ic-pause" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="6" y="5" width="4.25" height="14" rx="1.5"/><rect x="13.75" y="5" width="4.25" height="14" rx="1.5"/></svg>
            </button>
            <button id="nextBtn" class="ctl" type="button" aria-label="Next">
              <svg class="ic ic-next" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5.5 6.4v11.2a.9.9 0 0 0 1.4.75l8.3-5.6a.9.9 0 0 0 0-1.5L6.9 5.65a.9.9 0 0 0-1.4.75z"/><rect x="16.75" y="5.5" width="2.25" height="13" rx="1.125"/></svg>
            </button>
            <button id="repeatBtn" class="ctl ctl-toggle" type="button" aria-label="Repeat" title="Repeat" data-mode="off">
              <svg class="ic ic-repeat" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5v-2a3 3 0 0 1 3-3h13M17 3.5l3 3-3 3M20 12.5v2a3 3 0 0 1-3 3H4M7 20.5l-3-3 3-3"/></svg><svg class="ic ic-repeat-one" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5v-2a3 3 0 0 1 3-3h13M17 3.5l3 3-3 3M20 12.5v2a3 3 0 0 1-3 3H4M7 20.5l-3-3 3-3"/><path stroke-width="1.6" d="M10.9 10.4 12.4 9.4v5.2"/></svg>
            </button>
          </div>
          <div class="controls-side">
            <button id="heartBtn" class="ctl ctl-toggle" type="button" aria-label="Save to Liked Songs" title="Save to Liked Songs" aria-pressed="false" hidden>
              <svg class="ic ic-heart" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c-.3 0-.55-.08-.8-.26C8.4 17.7 4 14.2 4 9.6 4 7.05 5.95 5 8.4 5c1.5 0 2.8.73 3.6 1.9C12.8 5.73 14.1 5 15.6 5 18.05 5 20 7.05 20 9.6c0 4.6-4.4 8.1-7.2 10.14-.25.18-.5.26-.8.26z"/></svg><svg class="ic ic-heart-filled" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 20c-.3 0-.55-.08-.8-.26C8.4 17.7 4 14.2 4 9.6 4 7.05 5.95 5 8.4 5c1.5 0 2.8.73 3.6 1.9C12.8 5.73 14.1 5 15.6 5 18.05 5 20 7.05 20 9.6c0 4.6-4.4 8.1-7.2 10.14-.25.18-.5.26-.8.26z"/></svg>
            </button>
            <div id="volume" class="volume" hidden>
              <button id="volBtn" class="ctl" type="button" aria-label="Mute" title="Mute">
                <svg class="ic ic-volume-high" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2.6l4.15 3.6a.6.6 0 0 0 1-.45V5.85a.6.6 0 0 0-1-.45L7.6 9H5a1 1 0 0 0-1 1z"/><path d="M15.75 9.5a3.5 3.5 0 0 1 0 5M18.25 7a7 7 0 0 1 0 10"/></svg><svg class="ic ic-volume-low" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2.6l4.15 3.6a.6.6 0 0 0 1-.45V5.85a.6.6 0 0 0-1-.45L7.6 9H5a1 1 0 0 0-1 1z"/><path d="M15.75 9.5a3.5 3.5 0 0 1 0 5"/></svg><svg class="ic ic-mute" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2.6l4.15 3.6a.6.6 0 0 0 1-.45V5.85a.6.6 0 0 0-1-.45L7.6 9H5a1 1 0 0 0-1 1z"/><path d="m16 10 4 4M20 10l-4 4"/></svg>
              </button>
              <div class="vol-pop">
                <div id="volSlider" class="scrub vol-slider" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                  <div id="volFill" class="scrub-fill"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </main>

    <div id="panelLayer" class="overlay overlay-panel" hidden>
      <div class="backdrop" data-close></div>
      <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1">
        <header class="panel-head">
          <div class="panel-heading">
            <p class="panel-kicker">Playing from</p>
            <h2 id="panelTitle" class="panel-title"></h2>
          </div>
          <button class="icon-btn" type="button" data-close aria-label="Close">
            <svg class="ic ic-close" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </header>
        <div id="panelList" class="panel-list"></div>
      </aside>
    </div>

    <div id="library" class="overlay overlay-library" hidden>
      <div class="backdrop" data-close></div>
      <aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Library" tabindex="-1">
        <header class="sheet-bar">
          <h2 id="libTitle" class="sheet-title">Library</h2>
          <button id="libBack" class="btn btn-ghost btn-back" type="button" hidden>
            <svg class="ic ic-back" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.75 5.5 8.25 12l6.5 6.5"/></svg>
            <span class="back-label">Library</span>
          </button>
          <button class="icon-btn" type="button" data-close aria-label="Close">
            <svg class="ic ic-close" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </header>
        <div id="libTabs" class="lib-tabs" role="tablist" aria-label="Library">
          <button id="libTab-playlists" class="lib-tab" type="button" role="tab" data-tab="playlists" aria-controls="libPlaylists" aria-selected="true">Playlists</button>
          <button id="libTab-liked" class="lib-tab" type="button" role="tab" data-tab="liked" aria-controls="libLiked" aria-selected="false" tabindex="-1" hidden>Liked Songs</button>
          <button id="libTab-albums" class="lib-tab" type="button" role="tab" data-tab="albums" aria-controls="libAlbums" aria-selected="false" tabindex="-1" hidden>Albums</button>
          <button id="libTab-following" class="lib-tab" type="button" role="tab" data-tab="following" aria-controls="libFollowing" aria-selected="false" tabindex="-1" hidden>Artists</button>
          <button id="libTab-top" class="lib-tab" type="button" role="tab" data-tab="top" aria-controls="libTop" aria-selected="false" tabindex="-1" hidden>Your top</button>
          <button id="libTab-mixes" class="lib-tab" type="button" role="tab" data-tab="mixes" aria-controls="libMixes" aria-selected="false" tabindex="-1" hidden>Mixes</button>
        </div>
        <div id="sheetBody" class="sheet-body">
          <div id="libLevel1">
            <section id="libPlaylists" class="group lib-panel" role="tabpanel" aria-labelledby="libTab-playlists">
              <p id="listStatus" class="status" role="status" hidden></p>
              <div id="libList" class="rows"></div>
            </section>
            <section id="libLiked" class="group lib-panel" role="tabpanel" aria-labelledby="libTab-liked" hidden>
              <p class="status" role="status" hidden></p>
              <p id="likedNote" class="detail-note" hidden></p>
              <div id="likedRows" class="rows"></div>
            </section>
            <section id="libAlbums" class="group lib-panel" role="tabpanel" aria-labelledby="libTab-albums" hidden>
              <p class="status" role="status" hidden></p>
              <div class="albums"></div>
            </section>
            <section id="libFollowing" class="group lib-panel" role="tabpanel" aria-labelledby="libTab-following" hidden>
              <p class="status" role="status" hidden></p>
              <div class="albums"></div>
            </section>
            <section id="libTop" class="group lib-panel" role="tabpanel" aria-labelledby="libTab-top" hidden>
              <div id="topTabs" class="tabs" role="tablist" aria-label="Time range">
                <button class="tab" type="button" role="tab" data-range="short_term" aria-selected="true">4 weeks</button>
                <button class="tab" type="button" role="tab" data-range="medium_term" aria-selected="false">6 months</button>
                <button class="tab" type="button" role="tab" data-range="long_term" aria-selected="false">All time</button>
              </div>
              <p class="status" role="status" hidden></p>
              <h4 id="topArtistsHead" class="sub-title" hidden>Artists</h4>
              <div id="topArtists" class="albums"></div>
              <h4 id="topTracksHead" class="sub-title" hidden>Songs</h4>
              <div id="topTracks" class="rows"></div>
            </section>
            <section id="libMixes" class="group lib-panel" role="tabpanel" aria-labelledby="libTab-mixes" hidden>
              <div class="albums"></div>
            </section>
          </div>
          <div id="libDetail" hidden>
            <div class="detail-head">
              <div id="detailCover" class="art detail-cover"></div>
              <div class="detail-meta">
                <h2 id="detailName" class="sheet-title detail-name"></h2>
                <p id="detailSub" class="detail-sub"></p>
                <button id="detailPlay" class="btn btn-solid btn-play" type="button" disabled>Play</button>
              </div>
            </div>
            <p id="detailNote" class="detail-note" hidden></p>
            <p id="detailStatus" class="status" role="status" hidden></p>
            <div id="detailRows" class="rows"></div>
          </div>
        </div>
      </aside>
    </div>

    <div id="search" class="overlay overlay-search" hidden>
      <div class="backdrop" data-close></div>
      <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
        <label class="palette-field">
          <svg class="ic ic-search" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.25 15.25 4.75 4.75"/></svg>
          <input id="searchInput" type="text" placeholder="Songs or albums" aria-label="Search songs or albums" autocomplete="off" spellcheck="false" />
        </label>
        <div id="searchResults" class="palette-results" hidden></div>
      </div>
    </div>

    <div id="browse" class="overlay overlay-page" hidden>
      <section id="page" class="page" role="dialog" aria-modal="true" aria-labelledby="pageTitle" tabindex="-1">
        <header class="page-bar">
          <button id="pageBack" class="btn btn-ghost btn-back" type="button">
            <svg class="ic ic-back" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.75 5.5 8.25 12l6.5 6.5"/></svg>
            <span class="back-label">Back</span>
          </button>
          <button class="icon-btn" type="button" data-close aria-label="Close">
            <svg class="ic ic-close" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </header>
        <div id="pageBody" class="page-body">
          <div class="page-inner">
            <div class="page-head">
              <p id="pageKicker" class="page-kicker"></p>
              <h2 id="pageTitle" class="page-title"></h2>
              <p id="pageSub" class="page-sub" hidden></p>
            </div>
            <div id="pageTabs" class="tabs page-tabs" role="tablist" aria-label="Result type" hidden>
              <button id="pageTabTrack" class="tab" type="button" role="tab" data-tab="track" aria-selected="true" aria-controls="pageList">Songs</button>
              <button id="pageTabAlbum" class="tab" type="button" role="tab" data-tab="album" aria-selected="false" aria-controls="pageList" tabindex="-1">Albums</button>
            </div>
            <div id="pageList" class="page-list" role="tabpanel"></div>
            <p id="pageStatus" class="status page-status" role="status" hidden></p>
            <button id="pageMore" class="btn btn-ghost page-more" type="button" hidden>Load more</button>
          </div>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
