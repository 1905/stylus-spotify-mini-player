[package]
name = "web-player-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Spike: does the Spotify web player (open.spotify.com) play audio inside Tauri's WebKit layer
# (wry/WKWebView) on macOS for a Free account, also with its window hidden, and does Stylus's
# OAuth login inside the same WebView log the web player in too? wry and tao pinned to the
# versions Tauri 2 uses in src-tauri/Cargo.lock, so the result matches the app. sha2/base64/rand
# as in src-tauri (the PKCE challenge of the oauth mode).
[dependencies]
wry = "0.57.0"
tao = "0.37.1"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
