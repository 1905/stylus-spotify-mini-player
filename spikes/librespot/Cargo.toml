[package]
name = "librespot-spike"
version = "0.1.0"
edition = "2021"
publish = false

# P0 spike (plans/2026-10-02-standalone): can librespot play songs from my playlists on this Mac?
[dependencies]
librespot-core = "0.8.0"
librespot-playback = { version = "0.8.0", features = ["rodio-backend"] }
librespot-oauth = "0.8.0"
librespot-metadata = "0.8.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
dirs = "5"
env_logger = "0.11"
log = "0.4"
